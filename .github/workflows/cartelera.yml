def parse_date(ev_tag, raw_text: str) -> datetime:
    """Extrae la fecha del evento para ordenar cronológicamente de menor a mayor."""
    cal_link = ev_tag.select_one("a[href*='calendar.google.com']")
    if cal_link and cal_link.has_attr("href"):
        match = re.search(r"dates=(\d{4})(\d{2})(\d{2})", cal_link["href"])
        if match:
            try:
                y, m, d = match.groups()
                return datetime(int(y), int(m), int(d))
            except Exception:
                pass

    time_tag = ev_tag.select_one("time")
    if time_tag and time_tag.get("datetime"):
        dt_str = time_tag["datetime"][:10]
        try:
            return datetime.strptime(dt_str, "%Y-%m-%d")
        except Exception:
            pass

    match_iso = re.search(r"(\d{4})-(\d{2})-(\d{2})", raw_text)
    if match_iso:
        try:
            y, m, d = match_iso.groups()
            return datetime(int(y), int(m), int(d))
        except Exception:
            pass

    match_latam = re.search(r"(\d{1,2})/(\d{1,2})/(\d{4})", raw_text)
    if match_latam:
        try:
            d, m, y = match_latam.groups()
            return datetime(int(y), int(m), int(d))
        except Exception:
            pass

    return datetime(2099, 12, 31)

def extract_details(event_url: str):
    """Extrae el afiche oficial y el enlace directo de compra de boletas."""
    poster_url = ""
    ticket_link = ""

    if not event_url or "factormetal.com/eventos/" == event_url:
        return poster_url, ticket_link

    try:
        resp = requests.get(event_url, headers=HEADERS, timeout=10)
        if resp.status_code == 200:
            soup = BeautifulSoup(resp.text, "html.parser")
            
            # 1. Afiche original en alta resolución
            og_img = soup.select_one("meta[property='og:image']")
            if og_img and og_img.get("content"):
                url_img = og_img["content"]
                if "default" not in url_img.lower() and "logo" not in url_img.lower():
                    poster_url = url_img

            if not poster_url:
                img = soup.select_one(".tribe-events-event-image img, article img")
                if img:
                    poster_url = img.get("data-orig-file") or img.get("src") or ""

            # 2. Enlace de compra / tiquetera
            keywords = ["tuboleta", "ticketmaster", "eticket", "alltickets", "passline", "biciq", "entradas", "boletas", "ticket"]
            for a in soup.select("a[href]"):
                href = a["href"].lower()
                text = a.get_text().lower()
                if any(kw in href or kw in text for kw in keywords):
                    if not any(ign in href for ign in ["factormetal", "facebook", "twitter", "instagram", "calendar.google", "maps.google"]):
                        ticket_link = a["href"]
                        break
    except Exception as e:
        print(f"Error extrayendo detalles: {e}")

    return poster_url, ticket_link

