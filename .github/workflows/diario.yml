
name: Scraper Conciertos Rock y Metal

on:
  schedule:
    # Todos los días a las 07:00 UTC (02:00 AM en Bogotá)
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium

      - name: Ejecutar Scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper_conciertos.py

      - name: Guardar historial
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add eventos_registrados.json

          if git diff --cached --quiet; then
            echo "No hay cambios en el historial."
            exit 0
          fi

          git commit -m "Actualizar conciertos registrados [skip ci]"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Historial actualizado correctamente."
              exit 0
            fi

            echo "Intento $attempt fallido; se volverá a intentar."
            sleep 2
          done

          echo "No fue posible actualizar el historial."
          exit 1
